name: tests

on:
  push:
  pull_request:

jobs:
  exact-diagnostics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python scripts/run_structural_benchmark.py
      - run: python scripts/run_atlas_audit.py
      - run: python scripts/run_spectral_partition_audit.py
      - run: python scripts/run_tait_spectral_gate.py
